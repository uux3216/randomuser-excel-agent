name: Create Google Sheets with native comment threads

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "RandomUser seed (same seed produces repeatable test profiles)"
        required: true
        default: "randomuser-threaded-demo"

permissions:
  contents: read

jobs:
  create-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create spreadsheet and comments
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHARE_WITH_EMAIL: ${{ secrets.SHARE_WITH_EMAIL }}
          RANDOMUSER_SEED: ${{ inputs.seed }}
        run: python main.py
