name: Generate Random User Excel

on:
  workflow_dispatch:
    inputs:
      record_count:
        description: "Number of fictional test records (1-5000)"
        required: true
        default: "500"
      seed:
        description: "Seed for repeatable test data"
        required: true
        default: "excel-agent-demo"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate Excel file
        env:
          RECORD_COUNT: ${{ inputs.record_count }}
          RANDOMUSER_SEED: ${{ inputs.seed }}
          OUTPUT_FILE: users.xlsx
        run: python main.py

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: randomuser-excel
          path: users.xlsx
          if-no-files-found: error
          retention-days: 14
