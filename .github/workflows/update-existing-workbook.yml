name: Update existing Excel comments

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "RandomUser seed (same seed gives repeatable test profiles)"
        required: true
        default: "excel-agent-demo"

permissions:
  contents: write

jobs:
  update-workbook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update comments in existing workbook
        env:
          WORKBOOK_PATH: B7344.xlsx
          RANDOMUSER_SEED: ${{ inputs.seed }}
        run: python main.py

      - name: Commit updated workbook back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- B7344.xlsx
          if git diff --cached --quiet; then
            echo "No workbook changes to commit."
          else
            git commit -m "Add RandomUser comments to Work 1 B:F"
            git push
          fi
